# Local development overrides — applied automatically by `docker compose up`.
# NOT used in production (deploy with `docker compose -f docker-compose.yml up -d`).

services:
  app:
    environment:
      # Force long-polling so the container doesn't try to register a webhook
      # against the unreachable production host (api.pawly.app).
      NODE_ENV: development

  # langfuse-server's NEXTAUTH_URL override is gone: the base compose now
  # defaults it to http://localhost:3000 anyway, so this only ever restated the
  # default — while being the one thing that could quietly break a deployed
  # instance. This file is labelled "not used in production", but it sits in the
  # same checkout on the production box and `docker compose up` picks it up
  # unless someone remembers -f. A comment is not a guard.
